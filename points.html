<script>
function calculatePoints() {
  const passport = document.getElementById('passport').value;
  const canPlayDutch = document.getElementById('canPlayDutch')?.value;
  const arrivedWorkStudy = document.getElementById('arrivedWorkStudy')?.value;
  const playedBefore = document.getElementById('playedBefore')?.value;
  const highestLevel = document.getElementById('highestLevel')?.value;
  const startedBefore16 = document.getElementById('startedBefore16')?.value;
  const sameClub = document.getElementById('sameClub')?.value;

  let points = 0;
  let reason = "";

  // -------------------- NON-EU PLAYERS --------------------
  if (passport === "Other") {
    if (arrivedWorkStudy === "yes") {
      if (playedBefore === "no") {
        points = 1;
        reason = "Late starter (arrived for work/study and never played before)";
      } else {
            // Has played before → normally Expat
            // But check if level is Transition30Plus
            if (highestLevel === "Transition30Plus") {
                points = 3;
                reason = "Transition player (≥30 matches) - Non-EU, arrived for work/study";
            } else {
                points = 2;
                reason = "Expat player (Non-EU, arrived for work/study and played before)";
            }
        }
    } else if (arrivedWorkStudy === "no") {
      switch (highestLevel) {
        case "International": 
            points = 8; 
            reason = "International player"; 
            break;
            
        case "FirstClass": 
            points = 6; 
            reason = "First Class / List A player"; 
            break;

        case "Provincial": 
            points = 5; 
            reason = "Provincial / PRO Series player"; 
            break;

        case "ForeignClub": 
            points = 4; 
            reason = "Foreign club cricket player"; 
            break;

        case "Transition30Plus": 
            points = 3; 
            reason = "Non EU - Transition player (≥30 matches)"; 
            break;

        case "TransitionLess30": 
            points = 2; 
            reason = "Non EU - Transition player (<30 matches)"; 
            break;
        
        case "THE3YearsPlus": 
            points = 2; 
            reason = "Non EU - Top/Hofd/Erste Class (≥3 years at current club)"; 
            break;
        
        default:
          points = 0;
          reason = "No valid level selected.";
      }
    }
  }

  // -------------------- EU / DUTCH PLAYERS --------------------
    else if (passport === "EU") {
        if (playedBefore === "no") {
            // Never played cricket → always 1 point
            points = 1;
            reason = "Late starter (EU player, never played cricket before)";
        } else if (startedBefore16 === "yes" && sameClub === "yes") {
            points = 1;
            reason = "Started before 16 at the club (EU player)";
        } else if (sameClub === "yes") {
            points = 1;
            reason = "Retains existing points (same club) if already at 1";
        } else {
            const canPlay = canPlayDutch === "yes";

            switch (highestLevel) {
                case "International":
                    points = canPlay ? 5 : 6;
                    reason = "International player with EU passport";
                    break;

                case "FirstClass":
                    points = canPlay ? 4 : 5;
                    reason = "1st Class / List A player with EU passport";
                    break;

                case "Provincial":
                    points = canPlay ? 3 : 4;
                    reason = "Provincial / PRO Series player with EU passport";
                    break;

                case "ForeignClub":
                    points = 3;
                    reason = "Foreign club player with EU passport";
                    break;

                case "Transition30Plus":
                    points = 3; // always 3 for EU
                    reason = "Transition player (30+ matches) with EU passport";
                    break;

                case "TransitionLess30":
                    points = 2; // always 2 for EU
                    reason = "Transition player (<30 matches) with EU passport";
                    break;
                
                case "THE3YearsPlus": 
                    points = 1; 
                    reason = "EU - Top/Hofd/Erste Class (≥3 years at current club)"; 
                    break;
                
                default:
                    points = 0;
                    reason = "No valid level selected for EU player.";
            }
        }
    }

  // -------------------- DISPLAY RESULT --------------------
  document.getElementById('result').innerHTML = `
    <p><strong>Calculated Points:</strong> ${points}</p>
    <p class="text-sm text-gray-600 dark:text-gray-400">${reason}</p>
  `;
}
</script>
<script>
function toggleEUFields() {
  const passport = document.getElementById('passport').value;

  const startedBefore16Container = document.getElementById('startedBefore16Container');
  const startedBefore16 = document.getElementById('startedBefore16');

  const canPlayDutchContainer = document.getElementById('canPlayDutchContainer');
  const canPlayDutch = document.getElementById('canPlayDutch');

  const sameClubContainer = document.getElementById('sameClubContainer');
  const sameClub = document.getElementById('sameClub');

  if (passport === "EU") {
    // Show EU-only fields
    startedBefore16Container.classList.remove('hidden');
    startedBefore16.required = true;

    canPlayDutchContainer.classList.remove('hidden');
    canPlayDutch.required = true;

    sameClubContainer.classList.remove('hidden');
    sameClub.required = true;
  } else {
    // Hide EU-only fields
    startedBefore16Container.classList.add('hidden');
    startedBefore16.required = false;
    startedBefore16.value = "";

    canPlayDutchContainer.classList.add('hidden');
    canPlayDutch.required = false;
    canPlayDutch.value = "";

    sameClubContainer.classList.add('hidden');
    sameClub.required = false;
    sameClub.value = "";
  }
}
</script>

<script>
function toggleHighestLevel() {
  const playedBefore = document.getElementById('playedBefore').value;
  const highestLevelContainer = document.getElementById('highestLevelContainer');
  const highestLevel = document.getElementById('highestLevel').value;

  const sameClubContainer = document.getElementById('sameClubContainer');
  const sameClub = document.getElementById('sameClub');

  // Hide/show highestLevel based on playedBefore
  if (playedBefore === "no") {
    highestLevelContainer.classList.add('hidden');
    document.getElementById('highestLevel').required = false;
    document.getElementById('highestLevel').value = ""; // reset selection

    // Also hide sameClub
    sameClubContainer.classList.add('hidden');
    sameClub.required = false;
    sameClub.value = "";
  } else {
    highestLevelContainer.classList.remove('hidden');
    document.getElementById('highestLevel').required = true;

    // Hide sameClub for Transition or THE3YearsPlus
    if (
      highestLevel === "Transition30Plus" || 
      highestLevel === "TransitionLess30" || 
      highestLevel === "THE3YearsPlus"
    ) {
      sameClubContainer.classList.add('hidden');
      sameClub.required = false;
      sameClub.value = "";
    } else if (document.getElementById('passport').value === "EU") {
      // Show sameClub only for EU passport players if not Transition or THE3YearsPlus
      sameClubContainer.classList.remove('hidden');
      sameClub.required = true;
    } else {
      // Non-EU players should not see sameClub
      sameClubContainer.classList.add('hidden');
      sameClub.required = false;
      sameClub.value = "";
    }
  }
}

// Add event listeners if not already added
document.getElementById('playedBefore').addEventListener('change', toggleHighestLevel);
document.getElementById('highestLevel').addEventListener('change', toggleHighestLevel);
</script>

<script>
  // Simple cookie functions
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days*24*60*60*1000));
    const expires = "expires="+ d.toUTCString();
    document.cookie = name + "=" + value + ";" + expires + ";path=/;SameSite=Lax";
  }

  function getCookie(name) {
    let cname = name + "=";
    let decodedCookie = decodeURIComponent(document.cookie);
    let ca = decodedCookie.split(';');
    for(let i=0; i < ca.length; i++) {
      let c = ca[i].trim();
      if (c.indexOf(cname) === 0) {
        return c.substring(cname.length, c.length);
      }
    }
    return "";
  }

  // Elements
  const cookieBanner = document.getElementById("cookieBanner");
  const acceptBtn = document.getElementById("acceptCookies");

  // Show banner only if not accepted before
  if (getCookie("cookiesAccepted") === "true") {
    gtag('consent', 'update', {
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      ad_storage: 'granted',
      analytics_storage: 'granted'
    });
  } else {
    // Show banner if not accepted before
    cookieBanner.style.display = "flex";
  }

  // When Accept is clicked
  acceptBtn.addEventListener("click", function() {
    setCookie("cookiesAccepted", "true", 365); // 1 year
    gtag('consent', 'update', {
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      ad_storage: 'granted',
      analytics_storage: 'granted'
    });
    cookieBanner.classList.add("opacity-0");
    setTimeout(() => {
      cookieBanner.style.display = "none";
    }, 500);
  });
</script>

<script>
