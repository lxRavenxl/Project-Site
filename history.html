<script>
  // ===== Fetch Player Stats and create tables =====
  document.getElementById("fetchPlayerBtn").addEventListener("click", async () => {
    const playerId = document.getElementById("playerIdInput").value.trim();
    const seasonId = document.getElementById("seasonSelect").value;

    if (!playerId) return alert("Enter a player ID");

    const newTab = window.open(
    `https://matchcentre.kncb.nl/player/${playerId}/${seasonId}/`,
    "_blank",
    "noopener,noreferrer"
  );
  if (newTab) {
    handle.blur();
    window.focus();
    setTimeout(() => {
      try {
        newTab.close();
        console.log("New tab closed.");
      } catch (e) {
        console.warn("Could not close new tab:", e);
      }
    }, 1000);
    }

    setTimeout(async () => {
    const url = `https://api.resultsvault.co.uk/rv/0/report/rpt_plsml/?apiid=1002&seasonid=${seasonId}&playerid=${playerId}&sportid=1&sort=-DATE1`;

    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("Failed to fetch player data");

      const data = await resp.json();
      if (!data || data.length === 0) {
        document.getElementById("playerTable").innerHTML = "<p>No stats found for this player.</p>";
        document.getElementById("lastGamesTable").innerHTML = "";
        return;
      }

      // ===== Player Name =====
      const playerName = data[0].player_name || "Unknown Player";
      document.getElementById("playerTable").innerHTML = `<h3 class="text-xl font-bold mb-2">${playerName}</h3>`;

      // ===== Table 1: Games per team and competition =====
      const competitions = {}; // competition → { team → count }
      const teams = new Set();

      data.forEach(entry => {
        const team = entry.entity_name || "Other";
        entry.items.forEach(item => {
          if (item.id === "GRNM") {
            const competition = item.val || "Unknown";
            teams.add(team);
            if (!competitions[competition]) competitions[competition] = {};
            if (!competitions[competition][team]) competitions[competition][team] = 0;
            competitions[competition][team] += 1;
          }
        });
      });

            const teamList = Array.from(teams).sort();
      let htmlTable1 = `<table class="border-collapse border w-full text-sm mb-6 bg-white dark:bg-gray-900">
        <thead><tr><th class="bg-gray-700 dark:bg-gray-800 text-white dark:text-gray-100 border px-2 py-1">Competition</th>`;
      teamList.forEach(t => htmlTable1 += `<th class="bg-gray-700 dark:bg-gray-800 text-white dark:text-gray-100 border px-2 py-1">${t}</th>`);
      htmlTable1 += `</tr></thead><tbody>`;

      Object.keys(competitions).forEach((comp, idx) => {
        const rowClass = idx % 2 === 1 ? "bg-gray-100 dark:bg-gray-800" : "bg-white dark:bg-gray-900";
        htmlTable1 += `<tr class="${rowClass}"><td class="border px-2 py-1 font-bold text-gray-900 dark:text-gray-100">${comp}</td>`;
        teamList.forEach(t => {
          const count = competitions[comp][t] || 0;
          htmlTable1 += `<td class="border px-2 py-1 text-center text-gray-900 dark:text-gray-100">${count > 0 ? count : ""}</td>`;
        });
        htmlTable1 += `</tr>`;
      });
      htmlTable1 += `</tbody></table>`;

      // Append Table 1 under player name
      document.getElementById("playerTable").innerHTML += htmlTable1;

      // ===== Table 2: Last 3 games =====
      const lastThreeGames = data.slice(0, 3);
      let htmlTable2 = `<h3 class="text-xl font-bold mb-2">Last 3 Games</h3>
        <table class="border-collapse border w-full text-sm bg-white dark:bg-gray-900">
        <thead>
          <tr>
            <th class="bg-gray-700 dark:bg-gray-800 text-white dark:text-gray-100 border px-2 py-1">Date</th>
            <th class="bg-gray-700 dark:bg-gray-800 text-white dark:text-gray-100 border px-2 py-1">Team</th>
            <th class="bg-gray-700 dark:bg-gray-800 text-white dark:text-gray-100 border px-2 py-1">Competition</th>
          </tr>
        </thead>
        <tbody>`;

      lastThreeGames.forEach((entry, idx) => {
        const rowClass = idx % 2 === 1 ? "bg-gray-100 dark:bg-gray-800" : "bg-white dark:bg-gray-900";
        const team = entry.entity_name || "Other";
        let competition = "Unknown";
        let date = "";
        entry.items.forEach(item => {
          if (item.id === "GRNM") competition = item.val || "Unknown";
          if (item.id === "DATE1") date = item.val ? item.val.split(" ")[0] : "";
        });

        htmlTable2 += `<tr class="${rowClass}">
          <td class="border px-2 py-1 text-gray-900 dark:text-gray-100">${date}</td>
          <td class="border px-2 py-1 text-gray-900 dark:text-gray-100">${team}</td>
          <td class="border px-2 py-1 text-gray-900 dark:text-gray-100">${competition}</td>
        </tr>`;
      });

      htmlTable2 += `</tbody></table>`;
      document.getElementById("lastGamesTable").innerHTML = htmlTable2;

    } catch (error) {
      console.error(error);
      document.getElementById("playerTable").innerHTML = "<p>Failed to fetch player data. Try again.</p>";
      document.getElementById("lastGamesTable").innerHTML = "";
    }
    }, 2000); // wait 2 seconds before making the API call
  });
</script>

<script>
function loadHTML(id, url, callback) {
  fetch(url)
    .then(response => response.text())
    .then(data => {
      document.getElementById(id).innerHTML = data;
      if (callback) callback(); // run script after HTML is inserted
    })
    .catch(err => console.error(`Error loading ${url}:`, err));
}

// Load nav and footer
loadHTML("nav-main", "nav.html", () => {

  const menuBtn = document.getElementById("menuBtn");
  const mobileMenu = document.getElementById("mobileMenu");

  if (menuBtn && mobileMenu) {
    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });

    function closeMobileMenu() {
      mobileMenu.classList.add("hidden");
    }

    const homeBtnMobile = document.getElementById("homeBtnMobile");
    if (homeBtnMobile) homeBtnMobile.addEventListener("click", closeMobileMenu);

    const matchBtnMobile = document.getElementById("matchBtnMobile");
    if (matchBtnMobile) {
      matchBtnMobile.addEventListener("click", () => {
        if (typeof showMatch === "function") showMatch();
        closeMobileMenu();
      });
    }
  }
});
loadHTML("footer", "footer.html");
</script>

<script>
  // Simple cookie functions
  function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days*24*60*60*1000));
    const expires = "expires="+ d.toUTCString();
    document.cookie = name + "=" + value + ";" + expires + ";path=/;SameSite=Lax";
  }

  function getCookie(name) {
    let cname = name + "=";
    let decodedCookie = decodeURIComponent(document.cookie);
    let ca = decodedCookie.split(';');
    for(let i=0; i < ca.length; i++) {
      let c = ca[i].trim();
      if (c.indexOf(cname) === 0) {
        return c.substring(cname.length, c.length);
      }
    }
    return "";
  }

  // Elements
  const cookieBanner = document.getElementById("cookieBanner");
  const acceptBtn = document.getElementById("acceptCookies");

  // Show banner only if not accepted before
  if (getCookie("cookiesAccepted") === "true") {
    gtag('consent', 'update', {
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      ad_storage: 'granted',
      analytics_storage: 'granted'
    });
  } else {
    // Show banner if not accepted before
    cookieBanner.style.display = "flex";
  }

  // When Accept is clicked
  acceptBtn.addEventListener("click", function() {
    setCookie("cookiesAccepted", "true", 365); // 1 year
    gtag('consent', 'update', {
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      ad_storage: 'granted',
      analytics_storage: 'granted'
    });
    cookieBanner.classList.add("opacity-0");
    setTimeout(() => {
      cookieBanner.style.display = "none";
    }, 500);
  });
</script>
